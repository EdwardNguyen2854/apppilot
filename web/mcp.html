<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP - AppPilot</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="supergraphic"></div>

  <header class="header">
    <div class="header-inner">
      <a href="/web/index.html" class="logo">
        <span class="logo-icon">✦</span>
        AppPilot
      </a>
      <nav class="nav">
        <a href="/web/index.html">Dashboard</a>
        <a href="/web/apps.html">Apps</a>
        <a href="/web/usage.html">Usage</a>
        <a href="/web/mcp.html">MCP</a>
        <a href="/web/export.html">Export</a>
        <a href="/web/settings.html">Settings</a>
      </nav>
      <div class="header-actions"></div>
    </div>
  </header>

  <div class="container">
    <main class="main-content">
      <!-- Server Selector -->
      <div class="server-selector">
        <label for="mcp-server-select">MCP Server:</label>
        <select id="mcp-server-select" class="filter-select" onchange="onServerChange()">
          <option value="">Select an MCP server...</option>
        </select>
        <span id="connection-status" class="status-badge offline"><span class="dot"></span>Not connected</span>
        <span id="tool-count-badge" class="text-muted" style="font-size:0.82rem"></span>
      </div>

      <!-- Status Bar -->
      <div id="status-bar" class="status-bar" style="display:none">
        <div class="status-item"><span class="status-label">Status</span><span id="mcp-status-value" class="status-value">--</span></div>
        <div class="status-item"><span class="status-label">Tools</span><span id="mcp-tool-count" class="status-value">0</span></div>
        <div class="status-item"><span class="status-label">Resources</span><span id="mcp-resource-count" class="status-value">0</span></div>
        <div class="status-item"><span class="status-label">Prompts</span><span id="mcp-prompt-count" class="status-value">0</span></div>
        <div class="status-item"><span class="status-label">Initialized</span><span id="mcp-initialized-at" class="status-value">--</span></div>
      </div>

      <!-- Tabs -->
      <div class="tab-bar" id="tab-bar" style="display:none">
        <button class="tab-btn active" data-tab="tools" onclick="switchTab('tools')">Tools</button>
        <button class="tab-btn" data-tab="resources" onclick="switchTab('resources')">Resources</button>
        <button class="tab-btn" data-tab="prompts" onclick="switchTab('prompts')">Prompts</button>
      </div>

      <div id="tab-tools" class="tab-content active">
        <div id="tools-grid" class="mcp-items-grid"><p class="text-muted">Select a server to view tools.</p></div>
      </div>
      <div id="tab-resources" class="tab-content">
        <div id="resources-grid" class="mcp-items-grid"><p class="text-muted">No resources discovered.</p></div>
      </div>
      <div id="tab-prompts" class="tab-content">
        <div id="prompts-grid" class="mcp-items-grid"><p class="text-muted">No prompts discovered.</p></div>
      </div>
    </main>
  </div>

  <footer class="footer">
    <p>AppPilot v1.0.0 · <a href="/web/index.html">Dashboard</a></p>
  </footer>

  <script src="/static/js/app.js"></script>
  <script>
    let currentServerId = '';

    document.addEventListener('DOMContentLoaded', loadMCPApps);

    function loadMCPApps() {
      fetch('/api/apps').then(r=>r.json()).then(data => {
        const select = document.getElementById('mcp-server-select');
        const apps = (data.apps||[]).filter(a => a.type === 'mcp');
        select.innerHTML = '<option value="">Select an MCP server...</option>' + apps.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
      }).catch(console.error);
    }

    function onServerChange() {
      currentServerId = document.getElementById('mcp-server-select').value;
      if (currentServerId) {
        loadMCPStatus(currentServerId); loadMCPTools(currentServerId); loadMCPResources(currentServerId); loadMCPPrompts(currentServerId);
        document.getElementById('tab-bar').style.display = 'flex';
        document.getElementById('status-bar').style.display = 'grid';
      } else {
        document.getElementById('tab-bar').style.display = 'none';
        document.getElementById('status-bar').style.display = 'none';
        const cs = document.getElementById('connection-status');
        cs.innerHTML = '<span class="dot"></span>Not connected'; cs.className = 'status-badge offline';
      }
    }

    function loadMCPStatus(id) {
      fetch(`/api/apps/${id}/mcp/status`).then(r=>r.json()).then(data => {
        const cs = document.getElementById('connection-status');
        cs.innerHTML = `<span class="dot"></span>${data.status}`;
        cs.className = 'status-badge ' + statusClass(data.status);
        document.getElementById('mcp-status-value').textContent = data.status;
        document.getElementById('mcp-tool-count').textContent = data.tool_count;
        document.getElementById('mcp-resource-count').textContent = data.resource_count;
        document.getElementById('mcp-prompt-count').textContent = data.prompt_count;
        document.getElementById('mcp-initialized-at').textContent = data.initialized_at ? formatDateTime(data.initialized_at) : '--';
      }).catch(console.error);
    }

    function loadMCPTools(id) {
      fetch(`/api/apps/${id}/mcp/tools`).then(r=>r.json()).then(data => {
        const grid = document.getElementById('tools-grid');
        if (!data.tools || data.tools.length === 0) { grid.innerHTML = '<p class="text-muted">No tools discovered.</p>'; return; }
        grid.innerHTML = data.tools.map(t => `
          <div class="mcp-item-card">
            <div class="mcp-item-header"><span class="mcp-item-name">${escapeHtml(t.name)}</span></div>
            ${t.description ? `<p class="mcp-item-desc">${escapeHtml(t.description)}</p>` : ''}
            ${t.inputSchema ? `<div class="mcp-item-schema"><details><summary>Input Schema</summary><pre class="schema-json">${escapeHtml(JSON.stringify(t.inputSchema,null,2))}</pre></details></div>` : ''}
            <div class="mcp-item-actions"><button class="btn btn-sm btn-primary" disabled>Invoke</button></div>
          </div>`).join('');
      }).catch(() => document.getElementById('tools-grid').innerHTML = '<p class="text-muted">Failed to load tools.</p>');
    }

    function loadMCPResources(id) {
      fetch(`/api/apps/${id}/mcp/resources`).then(r=>r.json()).then(data => {
        const grid = document.getElementById('resources-grid');
        if (!data.resources || data.resources.length === 0) { grid.innerHTML = '<p class="text-muted">No resources discovered.</p>'; return; }
        grid.innerHTML = data.resources.map(r => `
          <div class="mcp-item-card">
            <div class="mcp-item-header"><span class="mcp-item-name">${escapeHtml(r.name)}</span><span class="mcp-item-uri">${escapeHtml(r.uri)}</span></div>
            ${r.description ? `<p class="mcp-item-desc">${escapeHtml(r.description)}</p>` : ''}
            ${r.mimeType ? `<span class="mcp-item-type">${escapeHtml(r.mimeType)}</span>` : ''}
          </div>`).join('');
      }).catch(() => document.getElementById('resources-grid').innerHTML = '<p class="text-muted">Failed to load resources.</p>');
    }

    function loadMCPPrompts(id) {
      fetch(`/api/apps/${id}/mcp/prompts`).then(r=>r.json()).then(data => {
        const grid = document.getElementById('prompts-grid');
        if (!data.prompts || data.prompts.length === 0) { grid.innerHTML = '<p class="text-muted">No prompts discovered.</p>'; return; }
        grid.innerHTML = data.prompts.map(p => `
          <div class="mcp-item-card">
            <div class="mcp-item-header"><span class="mcp-item-name">${escapeHtml(p.name)}</span></div>
            ${p.description ? `<p class="mcp-item-desc">${escapeHtml(p.description)}</p>` : ''}
            ${p.arguments ? `<div class="mcp-item-args"><details><summary>Arguments (${p.arguments.length})</summary><pre class="schema-json">${escapeHtml(JSON.stringify(p.arguments,null,2))}</pre></details></div>` : ''}
          </div>`).join('');
      }).catch(() => document.getElementById('prompts-grid').innerHTML = '<p class="text-muted">Failed to load prompts.</p>');
    }

    function switchTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      document.querySelector(`.tab-btn[data-tab="${name}"]`).classList.add('active');
    }

    function statusClass(s) {
      switch(s) { case 'initialized': return 'online'; case 'connecting': return 'warning'; case 'error': return 'error'; default: return 'offline'; }
    }
  </script>
</body>
</html>
