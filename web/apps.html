<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apps - AppPilot</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="supergraphic"></div>

  <header class="header">
    <div class="header-inner">
      <a href="/web/index.html" class="logo">
        <span class="logo-icon">✦</span>
        AppPilot
      </a>
      <nav class="nav">
        <a href="/web/index.html">Dashboard</a>
        <a href="/web/apps.html">Apps</a>
        <a href="/web/usage.html">Usage</a>
        <a href="/web/mcp.html">MCP</a>
        <a href="/web/export.html">Export</a>
        <a href="/web/settings.html">Settings</a>
      </nav>
      <div class="header-actions"></div>
    </div>
  </header>

  <div class="container">
    <main class="main-content">
      <div class="page-header">
        <h2>All Applications</h2>
        <div class="filter-bar">
          <input type="text" id="search-apps" placeholder="Search apps..." class="search-input" oninput="filterApps()">
          <select id="filter-type" class="filter-select" onchange="filterApps()">
            <option value="">All Types</option>
            <option value="desktop">Desktop</option>
            <option value="web">Web</option>
            <option value="api">API</option>
            <option value="external">External</option>
            <option value="mcp">MCP</option>
            <option value="background">Background</option>
          </select>
          <select id="filter-status" class="filter-select" onchange="filterApps()">
            <option value="">All Status</option>
            <option value="running">Running</option>
            <option value="stopped">Stopped</option>
          </select>
        </div>
      </div>

      <!-- Summary Cards -->
      <div class="summary-cards">
        <div class="summary-card">
          <div class="summary-icon">✦</div>
          <div class="summary-content">
            <div class="summary-value" id="total-apps">0</div>
            <div class="summary-label">Total Apps</div>
          </div>
        </div>
        <div class="summary-card success">
          <div class="summary-icon">▶</div>
          <div class="summary-content">
            <div class="summary-value" id="running-apps">0</div>
            <div class="summary-label">Running</div>
          </div>
        </div>
        <div class="summary-card warning">
          <div class="summary-icon">■</div>
          <div class="summary-content">
            <div class="summary-value" id="stopped-apps">0</div>
            <div class="summary-label">Stopped</div>
          </div>
        </div>
        <div class="summary-card">
          <div class="summary-icon">🔗</div>
          <div class="summary-content">
            <div class="summary-value" id="external-apps">0</div>
            <div class="summary-label">External</div>
          </div>
        </div>
      </div>

      <!-- Apps Table -->
      <div style="overflow-x:auto;margin-bottom:24px">
        <table class="apps-table">
          <thead>
            <tr><th>App</th><th>Type</th><th>Status</th><th>PID</th><th>CPU</th><th>Memory</th><th>Port</th><th>Actions</th></tr>
          </thead>
          <tbody id="apps-table-body">
            <tr><td colspan="8" class="loading-cell"><div class="loading-spinner"><div class="spinner"></div><span>Loading...</span></div></td></tr>
          </tbody>
        </table>
      </div>

      <!-- Sessions -->
      <section class="sessions-section">
        <h3>Recent Sessions</h3>
        <div id="sessions-container" class="sessions-list">
          <p class="text-muted">Loading session history...</p>
        </div>
      </section>
    </main>
  </div>

  <footer class="footer">
    <p>AppPilot v1.0.0 · <a href="/web/index.html">Dashboard</a></p>
  </footer>

  <script src="/static/js/app.js"></script>
  <script>
    let allApps = [];

    document.addEventListener('DOMContentLoaded', function() { loadAllApps(); loadSessions(); });

    function loadAllApps() {
      fetch('/api/apps').then(r=>r.json()).then(data => {
        allApps = data.apps || [];
        renderAppsTable(allApps);
        updateSummaryCards(allApps);
      }).catch(err => {
        document.getElementById('apps-table-body').innerHTML = '<tr><td colspan="8" class="error-cell">Failed to load applications</td></tr>';
      });
    }

    function renderAppsTable(apps) {
      const tbody = document.getElementById('apps-table-body');
      if (apps.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="empty-cell">No apps configured</td></tr>'; return; }
      tbody.innerHTML = apps.map(app => `
        <tr class="app-row${app.running ? ' running' : ''}" data-app-id="${app.id}" data-type="${app.type}">
          <td class="app-name-cell">
            <span style="font-size:1.1rem">${getAppIcon(app.type)}</span>
            <div class="app-name-info">
              <span class="app-name">${escapeHtml(app.name)}</span>
              <span class="app-id">${escapeHtml(app.id)}</span>
            </div>
          </td>
          <td><span class="type-badge type-${app.type}">${app.type}</span></td>
          <td><span class="status-badge${app.running ? ' online' : ' offline'}"><span class="dot"></span>${app.running ? 'Online' : 'Offline'}</span></td>
          <td class="mono">${app.pid || '-'}</td>
          <td>${app.cpu_percent ? app.cpu_percent.toFixed(1) + '%' : '-'}</td>
          <td>${app.memory_mb ? app.memory_mb.toFixed(1) + ' MB' : '-'}</td>
          <td class="mono">${app.port || '-'}</td>
          <td class="actions-cell">
            ${app.running ? `
              <button class="btn btn-sm btn-danger" onclick="stopApp('${app.id}')">Stop</button>
              <button class="btn btn-sm btn-warning" onclick="restartApp('${app.id}')">Restart</button>
              ${app.url ? `<button class="btn btn-sm btn-primary" onclick="openUrl('${app.url}')">Open</button>` : ''}
            ` : `
              <button class="btn btn-sm btn-success" onclick="startApp('${app.id}')">Start</button>
            `}
            ${app.type === 'mcp' ? `<button class="btn btn-sm btn-secondary" onclick="openMCPTools('${app.id}')">MCP Tools</button>` : ''}
            <button class="btn btn-sm btn-secondary" onclick="viewAppSessions('${app.id}')">Sessions</button>
            <button class="btn btn-sm btn-secondary" onclick="viewLogs('${app.id}')">Logs</button>
          </td>
        </tr>
      `).join('');
    }

    function updateSummaryCards(apps) {
      document.getElementById('total-apps').textContent = apps.length;
      document.getElementById('running-apps').textContent = apps.filter(a => a.running).length;
      document.getElementById('stopped-apps').textContent = apps.filter(a => !a.running).length;
      document.getElementById('external-apps').textContent = apps.filter(a => a.type === 'external').length;
    }

    function filterApps() {
      const search = document.getElementById('search-apps').value.toLowerCase();
      const typeFilter = document.getElementById('filter-type').value;
      const statusFilter = document.getElementById('filter-status').value;
      const filtered = allApps.filter(app => {
        const ms = app.name.toLowerCase().includes(search) || app.id.toLowerCase().includes(search) || (app.description||'').toLowerCase().includes(search);
        const mt = !typeFilter || app.type === typeFilter;
        const mst = !statusFilter || (statusFilter === 'running' && app.running) || (statusFilter === 'stopped' && !app.running);
        return ms && mt && mst;
      });
      renderAppsTable(filtered);
    }

    function loadSessions() {
      fetch('/api/usage/sessions?limit=20').then(r=>r.json()).then(data => {
        const c = document.getElementById('sessions-container');
        if (!data.sessions || data.sessions.length === 0) { c.innerHTML = '<p class="text-muted">No session history</p>'; return; }
        c.innerHTML = `<table class="data-table"><thead><tr><th>App</th><th>Started</th><th>Ended</th><th>Duration</th><th>Exit</th><th>Crashed</th></tr></thead><tbody>
          ${data.sessions.map(s => `
            <tr${s.crash_detected ? ' class="crash-row"' : ''}>
              <td><span class="app-tag">${escapeHtml(s.app_id)}</span></td>
              <td>${formatDateTime(s.started_at)}</td>
              <td>${s.stopped_at ? formatDateTime(s.stopped_at) : '-'}</td>
              <td>${s.duration_sec ? formatDuration(s.duration_sec) : '-'}</td>
              <td class="mono">${s.exit_code ?? '-'}</td>
              <td>${s.crash_detected ? '<span class="status-badge error"><span class="dot"></span>Yes</span>' : '<span class="status-badge success"><span class="dot"></span>No</span>'}</td>
            </tr>`).join('')}</tbody></table>`;
      }).catch(() => document.getElementById('sessions-container').innerHTML = '<p class="text-muted">Failed to load sessions</p>');
    }

    function viewAppSessions(appId) {
      fetch(`/api/apps/${appId}/sessions?limit=10`).then(r=>r.json()).then(data => showSessionsModal(appId, data.sessions)).catch(() => showNotification('error', 'Failed'));
    }
  </script>
</body>
</html>
